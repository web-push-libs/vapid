# For `venv` use `pip install .`
[build-system]
requires = ["hatchling", "pytest"]
build-backend = "hatchling.build"

[project]
name = "py-vapid"
version = "1.9.4"
# PYTHON_VER
requires-python = ">= 3.10"
license = { text = "MPL-2.0" }
description = "Simple VAPID header generation library"
readme = "README.rst"
authors = [{ name = "JR Conlin", email = "src+vapid@jrconlin.com" }]
keywords = ["vapid", "push", "webpush"]
classifiers = [
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = ["cryptography>=46"]

# Remember, to install these use `pip install --group ..`
# e.g. for testing only: `pip install --group test .`
# for development: `pip install --group dev -e .`
[dependency-groups]
test = ["pytest", "mock>=1.0", "coverage"]
dev = ["isort", "bandit", "black", { include-group = "test" }]
pub = ["build", "twine", {include-group = "dev" }]

[project.urls]
Homepage = "https://github.com/mozilla-services/vapid"

[project.scripts]
vapid = "py_vapid.main:main"

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.bandit]
# skips asserts
# B101: https://bandit.readthedocs.io/en/latest/plugins/b101_assert_used.html#
# skip false detect of hardcoded sql
# B608:https://bandit.readthedocs.io/en/latest/plugins/B608_hardcoded_sql_expressions.html#
skips = ["B101", "B608"]
exclude_dirs = ["py_vapid/tests"]

[tool.mypy]
disable_error_code = "attr-defined"
disallow_untyped_calls = false
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_error_codes = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
